# Deploys the static site in site/ to GitHub Pages.
name: Deploy static content to Pages

on:
  # Runs on pushes to the default branch, but only when the site (or this
  # workflow) actually changes. Editing the book doesn't trigger a redeploy.
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish ONLY the site folder, not the whole repo. The site's
          # index.html must be at the root of what gets uploaded, and the
          # book markdown and Python source have no business being served.
          # site/CNAME (the custom domain) rides along inside this folder.
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
